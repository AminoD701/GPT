<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <title>瑪奇Mobile│迪恩│公會成員名單</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
    :root { --bg:#090a0f; --panel:rgba(20,22,30,.78); --line:rgba(255,255,255,.1); --text:#f5f5f7; --muted:#a8aab5; --gold:#d7b56d; --purple:#9a82d8; --cyan:#7de0d0; --danger:#ef9a9a; }

    .stats { display:flex; gap:12px; flex-wrap:wrap; }

    .result-count { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; padding-bottom:64px; }

    // 圖片網址可填一般公開 Direct URL，也可填 Google Drive 分享網址。
    function convertGoogleDriveUrl(url) { const raw = String(url || '').trim(); if (!raw) return ''; const file = raw.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]+)/i) || raw.match(/[?&]id=([a-zA-Z0-9_-]+)/i); if (file) return `https://drive.google.com/thumbnail?id=${file[1]}&sz=w1200`; if (/^https?:\/\/[^\s"'<>]+$/i.test(raw)) return raw; return ''; }

    function parseCsv(text) { const rows=[]; let row=[], cell='', quoted=false; for(let i=0;i<text.length;i++){ const c=text[i], n=text[i+1]; if(c==='"'&&quoted&&n==='"'){cell+='"';i++;} else if(c==='"'){quoted=!quoted;} else if(c===','&&!quoted){row.push(cell.trim());cell='';} else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++; row.push(cell.trim()); if(row.some(Boolean))rows.push(row); row=[];cell='';} else cell+=c;} if(cell||row.length){row.push(cell.trim());if(row.some(Boolean))rows.push(row);} if(!rows.length)return []; const used={}; const headers=rows.shift().map(h=>{ const base=h.replace(/^\uFEFF/,''); used[base]=(used[base]||0)+1; return used[base]===1?base:`${base}__${used[base]}`; }); return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']))); }
    function isChecked(value) { return value === true || ['true','1','yes','y','是','有'].includes(String(value ?? '').trim().toLowerCase()); }

    function renderGuideArticleBlock(row) { const type=guideType(row), category=firstValue(row,['分類','category']), title=firstValue(row,['標題','title']), body=firstValue(row,['內文','內容','body','content']), image=firstValue(row,['圖片網址','圖片 URL','圖片URL','image']); if(type==='重點'||type==='highlight') return `<section class="guide-block guide-highlight"><span class="guide-label">${escapeHtml(category||'重點')}</span><h3>★ ${escapeHtml(title||'一句話記住')}</h3><p class="guide-body">${escapeHtml(body||STATUS_INCOMPLETE)}</p>${guideImageMarkup(image)}</section>`; return `<section class="guide-block article-block"><div><span class="guide-label">${escapeHtml(category||'骰子教學')}</span><h3>${escapeHtml(title||STATUS_INCOMPLETE)}</h3><p class="guide-body">${escapeHtml(body||STATUS_INCOMPLETE)}</p></div>${guideImageMarkup(image)}</section>`; }

    async function loadDiceGuide() { try { const response=await fetch(`${CONFIG.guideSheetUrl}&_=${Date.now()}`,{cache:'no-store'}); if(!response.ok)throw new Error(`Dice guide CSV HTTP ${response.status}`); const csv=await response.text(); const rows=parseCsv(csv); const headers=rows.length?Object.keys(rows[0]):[]; const expected=['排序','類型','分類','標題','內文','骰子','武器','防具','項鍊','戒指','圖片網址','是否顯示']; if(!expected.some(header=>headers.includes(header))) console.warn('[Guild Roster] 骰子教學 CSV 欄位異常，目前 Headers:',headers); guideRows=sortGuideRows(rows.filter(row=>isChecked(firstValue(row,['是否顯示','顯示','visible','show'])))); guideLoaded=true; console.log('骰子教學資料:',guideRows); renderGuideArticle(); } catch(error) { console.error('[Guild Roster] 骰子教學讀取失敗：',error); guideLoaded=true; guideRows=[]; renderGuideArticle(); } }

    function showRuneDetail(className) { selectedRuneClass=className; selectedRuneBuild=''; $('guideHome').hidden=true; $('guideArticle').hidden=true; $('runeHome').hidden=true; $('runeDetail').hidden=false; renderRuneDetail(); }
    async function loadRuneGuide() { try { const response=await fetch(`${CONFIG.runeGuideSheetUrl}&_=${Date.now()}`,{cache:'no-store'}); if(!response.ok)throw new Error(`Rune guide CSV HTTP ${response.status}`); const rows=parseCsv(await response.text()); const headers=rows.length?Object.keys(rows[0]):[]; const missing=RUNE_REQUIRED_HEADERS.filter(header=>!headers.includes(header)); if(missing.length)throw new Error(`裝備符文 CSV 缺少欄位：${missing.join(', ')}`); runeGuideRows=rows.map((row,index)=>({...row,__rowNumber:index+2})).filter(runeVisible); console.log('符文資料:',runeGuideRows); console.log('職業:',runeClassList(runeGuideRows).map(item=>item.name)); console.log('流派:',[...new Set(runeGuideRows.map(row=>runeCell(row,'流派')).filter(Boolean))]); const unknown=[...new Set(runeGuideRows.map(row=>runeCell(row,'職業')).filter(name=>name&&!RUNE_OFFICIAL_CLASSES.has(name)))]; if(unknown.length)console.warn('[Guild Roster] 試算表含非官方職業，已排除：',unknown); runeGuideLoaded=true; renderRuneHome(); } catch(error) { console.error('[Guild Roster] 裝備符文讀取失敗：',error); runeGuideLoaded=true; runeGuideRows=[]; renderRuneHome(); } }

    const DICE_REFERENCE_SOURCE = '個人裝備階段進度與對照表-單頁版.xlsx／裝備評估與對照表';
    const DICE_STAGES = [

    let diceGearState = {};
    function diceTypeFor(gear) { return gear==='weapon'?'weapon':gear==='ring'?'ring':gear==='necklace'?'necklace':'armor'; }
    function diceValueForStage(stage,type) { return stage[type]; }
    function getGearStage(type,value) { const stages=DICE_STAGES.filter(stage=>value<diceValueForStage(stage,type)); return stages[0]||null; }
    function calculateGearProgress(type,value) { if(value===''||value===null||value===undefined)return {empty:true}; const numeric=Number(value); if(!Number.isFinite(numeric)||numeric<0)return {empty:true}; const next=getGearStage(type,numeric); const previous=[...DICE_STAGES].reverse().find(stage=>numeric>=diceValueForStage(stage,type)); if(!next){return {empty:false,highest:true,current:numeric,reachedStage:previous?.stage||DICE_STAGES[DICE_STAGES.length-1].stage,nextStage:null,target:diceValueForStage(DICE_STAGES[DICE_STAGES.length-1],type),shortage:0,percent:100};} const target=diceValueForStage(next,type); return {empty:false,highest:false,current:numeric,reachedStage:previous?.stage||null,nextStage:next.stage,target,shortage:Math.max(0,target-numeric),percent:Math.min(100,Math.max(0,numeric/target*100))}; }
    function loadGearProgress() { try { const parsed=JSON.parse(localStorage.getItem(DICE_STORAGE_KEY)||'{}'); if(!parsed||typeof parsed!=='object')throw new Error('invalid storage'); diceGearState=DICE_GEAR.reduce((state,gear)=>{ const item=parsed[gear.key]; const value=typeof item==='number'?item:item?.value; state[gear.key]={value:typeof value==='number'&&Number.isFinite(value)&&value>=0?value:''}; return state; },{}); } catch(error) { console.warn('[Guild Roster] 骰子進度資料無法讀取，已重置：',error); diceGearState={}; DICE_GEAR.forEach(gear=>diceGearState[gear.key]={value:''}); } }

    function renderDiceSummary() { const entered=DICE_GEAR.map(gear=>({gear,result:calculateGearProgress(diceTypeFor(gear.key),diceGearState[gear.key]?.value)})).filter(item=>!item.result.empty); const summary=$('diceSummary'); if(!entered.length){summary.hidden=true;return;} const lowest=entered.reduce((a,b)=>b.result.percent<a.result.percent?b:a); const best=entered.reduce((a,b)=>b.result.percent>a.result.percent?b:a); const highest=entered.filter(item=>item.result.highest).length; summary.hidden=false; summary.innerHTML=`<h3>目前裝備進度摘要</h3><div class="dice-summary-grid"><div class="dice-summary-item"><span>已輸入</span><b>${entered.length} / ${DICE_GEAR.length}</b></div><div class="dice-summary-item"><span>最高進度</span><b>${best.gear.label} ${Math.floor(best.result.percent)}%</b></div><div class="dice-summary-item"><span>目前優先提升</span><b>${lowest.gear.label} · ${Math.floor(lowest.result.percent)}%</b></div><div class="dice-summary-item"><span>已達最高階</span><b>${highest} / ${entered.length}</b></div></div>`; }
    function renderDiceResults() { DICE_GEAR.forEach(gear=>{ const row=document.querySelector(`[data-dice-row-key="${gear.key}"]`); if(!row)return; const result=calculateGearProgress(diceTypeFor(gear.key),diceGearState[gear.key]?.value); const set=(name,value,muted=false)=>{const node=row.querySelector(`[data-dice-${name}]`); if(!node)return; node.textContent=value; node.classList.toggle('dice-cell-muted',muted);}; if(result.empty){set('reached','尚未輸入',true);set('next','—',true);set('target','—',true);set('shortage','—',true);set('percent','—',true);row.querySelector('[data-dice-progress]').style.width='0%';return;} set('reached',result.reachedStage?String(result.reachedStage):`未達${DICE_STAGES[0].stage}`,!result.reachedStage); set('next',result.highest?'最高階':String(result.nextStage),result.highest); set('target',String(result.target)); set('shortage',String(result.shortage)); set('percent',`${Math.floor(result.percent)}%`); row.querySelector('[data-dice-progress]').style.width=`${result.percent.toFixed(1)}%`; }); renderDiceSummary(); }
    function renderDiceInputs() { const grid=$('diceInputGrid'); grid.innerHTML=`<table class="dice-progress-table"><thead><tr><th>部位</th><th>目前數值</th><th>目前已達階段</th><th>下一目標階段</th><th>目標數值</th><th>還差</th><th>進度</th></tr></thead><tbody>${DICE_GEAR.map(gear=>{ const state=diceGearState[gear.key]||{value:''}; return `<tr data-dice-row-key="${gear.key}"><td class="dice-part"><span class="dice-part-icon" aria-hidden="true">${gear.icon}</span>${gear.label}</td><td><input class="dice-value-input" id="diceValue-${gear.key}" data-dice-value="${gear.key}" type="number" min="0" inputmode="numeric" value="${state.value===''?'':diceEscapedInput(state.value)}" placeholder="—" aria-label="${gear.label}目前基本性質"></td><td data-dice-reached class="dice-cell-muted">尚未輸入</td><td data-dice-next class="dice-cell-muted">—</td><td data-dice-target class="dice-cell-muted">—</td><td data-dice-shortage class="dice-cell-muted">—</td><td><div class="dice-progress-cell"><strong data-dice-percent class="dice-cell-muted">—</strong><div class="dice-progress" aria-hidden="true"><i data-dice-progress style="width:0%"></i></div></div></td></tr>`; }).join('')}</tbody></table>`; grid.querySelectorAll('[data-dice-value]').forEach(input=>input.addEventListener('input',event=>{const value=Number(event.target.value); diceGearState[event.target.dataset.diceValue].value=event.target.value!==''&&Number.isFinite(value)&&value>=0?value:''; saveGearProgress(); renderDiceResults();})); renderDiceResults(); }
    function renderDiceReferenceTable() { const table=$('diceReferenceTable'); const chips=$('diceStageChips'); chips.innerHTML=DICE_STAGES.map(stage=>`<button class="dice-stage-chip" type="button" data-dice-stage="${stage.stage}">${stage.stage}</button>`).join(''); table.innerHTML=`<div class="guide-table-wrap"><table class="guide-table dice-reference-table"><thead><tr><th>骰子階段</th><th>武器</th><th>防具</th><th>戒指</th><th>項鍊</th></tr></thead><tbody>${DICE_STAGES.map(stage=>`<tr data-dice-row="${stage.stage}"><td>${stage.stage}</td><td>${stage.weapon}</td><td>${stage.armor}</td><td>${stage.ring}</td><td>${stage.necklace}</td></tr>`).join('')}</tbody></table></div>`; chips.querySelectorAll('[data-dice-stage]').forEach(chip=>chip.addEventListener('click',()=>{table.querySelectorAll('tr').forEach(row=>row.classList.remove('stage-highlight')); const row=table.querySelector(`[data-dice-row="${chip.dataset.diceStage}"]`); row?.classList.add('stage-highlight'); row?.scrollIntoView({behavior:'smooth',block:'nearest'}); chips.querySelectorAll('.dice-stage-chip').forEach(item=>item.classList.toggle('active',item===chip));})); }
    function clearGearProgress() { DICE_GEAR.forEach(gear=>diceGearState[gear.key]={value:''}); saveGearProgress(); renderDiceInputs(); }
    function renderGuideArticle() { const article=$('guideArticle'); loadGearProgress(); const articleRows=sortGuideRows(guideRows).filter(row=>!['表格','table'].includes(guideType(row))); const blocks=articleRows.map(renderGuideArticleBlock).join(''); article.innerHTML=`<div class="guide-article-head"><div><p class="guide-kicker">DICE GUIDE / BEGINNER</p><h2>骰子與裝備進度</h2><p class="guide-intro">先理解骰子階段，再用計算器找出下一個裝備目標。</p></div><button class="guide-back" id="backToGuideHome" type="button">← 返回新手教學</button></div><div class="guide-article"><section class="dice-concept"><div class="dice-section-number">01 骰子怎麼看？</div><h3>骰子的數字代表什麼？</h3><p>骰子階段代表裝備「基本性質」可前進的階段。不同裝備部位的基本性質數值不同，不能直接把武器、防具、戒指與項鍊當成相同數值比較。</p><p>例如 2232 階段：武器 2232、防具 572、戒指 301、項鍊 336。</p><div class="dice-example"><span>武器<b>2232</b></span><span>防具<b>572</b></span><span>戒指<b>301</b></span><span>項鍊<b>336</b></span></div></section>${blocks?`<section><div class="dice-section-title"><div><div class="dice-section-number">骰子教學文章</div><h3>基本觀念與使用說明</h3></div></div><div class="guide-article">${blocks}</div></section>`:''}<section class="dice-calculator"><div class="dice-section-title"><div><div class="dice-section-number">02 個人裝備進度計算器</div><h3>個人裝備階段進度</h3><p>輸入目前裝備基本性質，系統會自動判定下一個目標骰子階段。</p></div><button class="dice-clear" id="clearDiceProgress" type="button">清除全部</button></div><div class="dice-summary" id="diceSummary" hidden></div><div class="dice-input-grid" id="diceInputGrid"></div></section><section class="dice-table-section"><div class="dice-section-title"><div><div class="dice-section-number">03 骰子階段完整對照表</div><h3>骰子階段完整對照表</h3></div></div><div class="dice-stage-chips" id="diceStageChips" aria-label="骰子階段快速定位"></div><div id="diceReferenceTable"></div><p class="dice-note">數值基準取自 ${DICE_REFERENCE_SOURCE}。本工具以裝備「基本性質」判定階段；防具包含頭盔、衣服、褲子、手套、鞋子，不同部位共用防具欄的階段要求。</p></section></div>`; $('backToGuideHome').addEventListener('click',showGuideHome); $('clearDiceProgress').addEventListener('click',clearGearProgress); renderDiceInputs(); renderDiceReferenceTable(); }

    // 目前試算表欄位：公會名稱、 本尊職業、 本尊遊戲ID、 Line名稱、圖片網址、傳說套裝、
    // 分身職業、分身ID（重複 5 組）。重複欄名會在 parseCsv 中自動編成 __2、__3…，再依欄位順序配對。
    function hasLegendarySet(value) { return value === true || String(value ?? '').trim().toLowerCase() === 'true'; }
    function parseMembers(rows) { return rows.filter(row=>truthy(firstValue(row,['是否顯示','顯示','visible','show']))).map((row,index)=>{ const roles=[]; const guild=firstValue(row,['公會名稱','\u5de5\u6703\u540d\u7a31','guild','guildname']); const mainId=firstValue(row,['本尊遊戲ID','本尊ID','mainid']); const mainClass=firstValue(row,['本尊職業','主職業','mainclass']); const image=firstValue(row,['圖片網址','圖片 URL','圖片URL','角色圖片網址','本尊圖片','角色圖片','圖片','image','avatar']); const legendarySet=hasLegendarySet(firstValue(row,['傳說套裝','legendarySet','legendary'])); if(mainId||mainClass) roles.push(['本尊',mainClass,mainId]); const keys=Object.keys(row); const repeatedClasses=keys.filter(k=>normalizeKey(k).startsWith(normalizeKey('分身職業'))); const repeatedIds=keys.filter(k=>normalizeKey(k).startsWith(normalizeKey('分身ID'))); for(let i=0;i<5;i++){ const id=cleanValue(row[repeatedIds[i]]); const cls=cleanValue(row[repeatedClasses[i]]); if(id||cls) roles.push([`分身 ${i+1}`,cls,id]); } return { guild, lineName:firstValue(row,['LINE名稱','LINE 名稱','Line名稱','line','linename','暱稱']), mainId, mainClass, image, legendarySet, roles, sort:Number(firstValue(row,['排序','sort','order']))||9999, note:firstValue(row,['備註','note']) , index }; }); }
    function getMemberStatus(member) { const hasGameId=Boolean(cleanValue(member.mainId)); const hasGuild=Boolean(cleanValue(member.guild)); const hasMainClass=Boolean(cleanValue(member.mainClass)); const isComplete=hasGameId&&hasGuild&&hasMainClass; let rank=0; if(!isComplete){ if(!hasGameId) rank=1; else if(!hasGuild) rank=2; else rank=3; } return {hasGameId,hasGuild,hasMainClass,isComplete,rank}; }
    function sortMembers(list) { return [...list].sort((a,b)=>{ const statusDiff=getMemberStatus(a).rank-getMemberStatus(b).rank; if(statusDiff)return statusDiff; return (a.sort-b.sort)||(a.index-b.index); }); }
    function displayGuild(member) { return getMemberStatus(member).hasGuild ? member.guild : STATUS_WAITING_GUILD; }
    function displayGameId(member) { return getMemberStatus(member).hasGameId ? member.mainId : STATUS_INCOMPLETE; }
    function displayClass(value) { return cleanValue(value)||STATUS_INCOMPLETE; }
    function fillFilters() { const completeClasses=[...new Set(members.filter(m=>getMemberStatus(m).hasMainClass).map(m=>m.mainClass))].sort(); const incompleteClass=members.some(m=>!getMemberStatus(m).hasMainClass); const completeGuilds=[...new Set(members.filter(m=>getMemberStatus(m).hasGuild).map(m=>m.guild))].sort(); const waitingGuild=members.some(m=>!getMemberStatus(m).hasGuild); $('classFilter').innerHTML='<option value="">全部本尊職業</option>'+completeClasses.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')+(incompleteClass?`<option value="__INCOMPLETE__">${STATUS_INCOMPLETE}</option>`:''); $('guildFilter').innerHTML='<option value="">全部公會</option>'+completeGuilds.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')+(waitingGuild?`<option value="__WAITING_GUILD__">${STATUS_WAITING_GUILD}</option>`:''); }
    function escapeHtml(value) { return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function render() { const q=$('searchInput').value.trim().toLowerCase(), guild=$('guildFilter').value, cls=$('classFilter').value; const filtered=members.filter(m=>{ const text=[displayGuild(m),m.lineName,displayGameId(m),displayClass(m),...m.roles.flat()].join(' ').toLowerCase(); const guildMatch=guild==='__WAITING_GUILD__'?!getMemberStatus(m).hasGuild:(!guild||m.guild===guild); const classMatch=cls==='__INCOMPLETE__'?!getMemberStatus(m).hasMainClass:(!cls||m.mainClass===cls); return (!q||text.includes(q))&&guildMatch&&classMatch; }); const visible=sortMembers(filtered); $('resultCount').textContent=`顯示 ${visible.length} 位冒險者`; $('memberTotal').textContent=visible.length; $('roleTotal').textContent=visible.reduce((n,m)=>n+m.roles.length,0); $('memberGrid').innerHTML=visible.length?visible.map(m=>{ const status=getMemberStatus(m); return `<button class="member-card${m.legendarySet?' legendary':''}" type="button" data-index="${members.indexOf(m)}"><div class="portrait"><img src="${escapeHtml(avatarUrl(m.image))}" alt="${escapeHtml(displayGameId(m))} 的角色圖片" data-fallback="1"><span class="class-pill">角色展示</span>${m.legendarySet?'<span class="legendary-badge show"><b>✦ 傳說</b><small>LEGENDARY</small></span>':''}</div><div class="card-body"><div class="line-name ${status.hasGuild?'':'pending'}">${escapeHtml(displayGuild(m))}</div><div class="main-id ${status.hasGameId?'':'pending'}">${escapeHtml(displayGameId(m))}</div><div class="card-foot"><span>查看六個角色</span><span>→</span></div></div></button>`; }).join(''):'<div class="empty">找不到符合條件的冒險者<br><small>試試其他關鍵字或清除篩選</small></div>'; $('memberGrid').querySelectorAll('img[data-fallback]').forEach(img=>img.addEventListener('error',()=>{img.src=FALLBACK_IMAGE;img.removeAttribute('data-fallback');},{once:true})); }
    function openMember(member) { $('modalTitle').textContent=displayGameId(member); $('modalGuild').textContent=displayGuild(member); $('modalLine').textContent=member.lineName||STATUS_INCOMPLETE; $('modalMainId').textContent=displayGameId(member); $('modalMainClass').textContent=displayClass(member.mainClass); $('modalRoleCount').textContent=member.roles.length; $('modalLegendary').classList.toggle('show',member.legendarySet); const image=$('modalImage'); image.classList.toggle('legendary',member.legendarySet); image.src=avatarUrl(member.image); image.alt=displayGameId(member)+' 的角色圖片'; image.onerror=()=>{image.src=FALLBACK_IMAGE;image.onerror=null;}; $('modalRoles').innerHTML=member.roles.map((r,i)=>`<div class="role-row ${i===0?'main':''}${i===0&&member.legendarySet?' legendary':''}"><div class="role-tag">${i===0?'✦ ':''}${escapeHtml(r[0])}</div><div class="role-cell"><small>職業</small><span>${escapeHtml(displayClass(r[1]))}</span></div><div class="role-cell"><small>遊戲 ID</small><span>${escapeHtml(cleanValue(r[2])||STATUS_INCOMPLETE)}</span></div></div>`).join(''); $('memberDialog').showModal(); }
    async function loadMembers() { $('guildName').textContent=CONFIG.guildName; try { const response=await fetch(`${CONFIG.sheetUrl}&_=${Date.now()}`,{cache:'no-store'}); if(!response.ok)throw new Error(`Published CSV HTTP ${response.status}`); const csv=await response.text(); if(!csv.includes('公會名稱')&&!csv.includes('\u5de5\u6703\u540d\u7a31')&&!csv.includes('本尊遊戲ID'))throw new Error('公開 CSV 內容不像公會名單，請確認發布的工作表與 GID'); const parsed=parseMembers(parseCsv(csv)); if(!parsed.length)throw new Error('Google Sheet 沒有可用的成員資料'); members=parsed; console.info('[Guild Roster] 已透過發布到網路的 CSV 取得資料。'); fillFilters(); render(); } catch(error) { console.error('[Guild Roster] Google Sheet CSV 讀取失敗：',error); members=[]; $('memberTotal').textContent='—'; $('roleTotal').textContent='—'; $('resultCount').textContent='資料讀取失敗'; $('memberGrid').innerHTML='<div class="error"><strong>目前無法取得 Google Sheet 的公會成員資料。</strong>請確認「發布到網路」連結仍有效，且網址中的 gid=2083968754 指向「公會成員名單」工作表。<br><small>此頁面不會使用虛構會員資料；詳細錯誤已記錄在瀏覽器 Console。</small></div>'; } }
    $('searchInput').addEventListener('input',render); $('guildFilter').addEventListener('change',render); $('classFilter').addEventListener('change',render); $('memberGrid').addEventListener('click',e=>{const card=e.target.closest('.member-card');if(card)openMember(members[Number(card.dataset.index)]);}); $('closeModal').addEventListener('click',()=>$('memberDialog').close()); $('memberDialog').addEventListener('click',e=>{if(e.target===$('memberDialog'))$('memberDialog').close();}); $('membersTab').addEventListener('click',()=>switchView('members')); $('guidesTab').addEventListener('click',()=>switchView('guides')); $('diceGuideEntry').addEventListener('click',()=>showGuideArticle()); $('runeGuideEntry').addEventListener('click',()=>showRuneHome()); document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('memberDialog').open)$('memberDialog').close();}); loadMembers();
  </script>
</body>
