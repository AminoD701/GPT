<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <title>瑪奇Mobile│迪恩│公會成員名單</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
    :root { --bg:#090a0f; --panel:rgba(20,22,30,.78); --line:rgba(255,255,255,.1); --text:#f5f5f7; --muted:#a8aab5; --gold:#d7b56d; --purple:#9a82d8; --cyan:#7de0d0; --danger:#ef9a9a; }

    .stats { display:flex; gap:12px; flex-wrap:wrap; }

    .result-count { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; padding-bottom:64px; }

    function normalizeKey(value) { return String(value ?? '').toLowerCase().replace(/[\s_\-（）()：:]/g,''); }
    function cleanValue(value) { const text=String(value ?? '').trim(); return (!text || ['null','undefined','-','—'].includes(text.toLowerCase())) ? '' : text; }
    function firstValue(row, aliases) { const keys = Object.keys(row); const wanted = aliases.map(normalizeKey); const key = keys.find(k => wanted.includes(normalizeKey(k)) || wanted.some(a => normalizeKey(k).includes(a))); return key ? cleanValue(row[key]) : ''; }
    function truthy(value) { return !['false','0','no','否','隱藏','不顯示'].includes(String(value).trim().toLowerCase()); }
    // 圖片網址可填一般公開 Direct URL，也可填 Google Drive 分享網址。
    function convertGoogleDriveUrl(url) { const raw = String(url || '').trim(); if (!raw) return ''; const file = raw.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]+)/i) || raw.match(/[?&]id=([a-zA-Z0-9_-]+)/i); if (file) return `https://drive.google.com/thumbnail?id=${file[1]}&sz=w1200`; if (/^https?:\/\/[^\s"'<>]+$/i.test(raw)) return raw; return ''; }
    function avatarUrl(url) { return convertGoogleDriveUrl(url) || FALLBACK_IMAGE; }
    function parseCsv(text) { const rows=[]; let row=[], cell='', quoted=false; for(let i=0;i<text.length;i++){ const c=text[i], n=text[i+1]; if(c==='"'&&quoted&&n==='"'){cell+='"';i++;} else if(c==='"'){quoted=!quoted;} else if(c===','&&!quoted){row.push(cell.trim());cell='';} else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++; row.push(cell.trim()); if(row.some(Boolean))rows.push(row); row=[];cell='';} else cell+=c;} if(cell||row.length){row.push(cell.trim());if(row.some(Boolean))rows.push(row);} if(!rows.length)return []; const used={}; const headers=rows.shift().map(h=>{ const base=h.replace(/^\uFEFF/,''); used[base]=(used[base]||0)+1; return used[base]===1?base:`${base}__${used[base]}`; }); return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']))); }
    function isChecked(value) { return value === true || ['true','1','yes','y','是','有'].includes(String(value ?? '').trim().toLowerCase()); }
    function guideType(row) { return cleanValue(firstValue(row,['類型','type'])).toLowerCase(); }
    function guideSortValue(row) { const value=Number(firstValue(row,['排序','sort','order'])); return Number.isFinite(value)&&value>0?value:999999; }
    function sortGuideRows(rows) { return [...rows].sort((a,b)=>guideSortValue(a)-guideSortValue(b)); }
    function guideImageMarkup(url) { const src=avatarUrl(url); return src===FALLBACK_IMAGE||!cleanValue(url)?'':`<div class="guide-image-wrap"><img class="guide-image" src="${escapeHtml(src)}" alt="教學圖片" loading="lazy"></div>`; }
    function renderGuideArticleBlock(row) { const type=guideType(row), category=firstValue(row,['分類','category']), title=firstValue(row,['標題','title']), body=firstValue(row,['內文','內容','body','content']), image=firstValue(row,['圖片網址','圖片 URL','圖片URL','image']); if(type==='重點'||type==='highlight') return `<section class="guide-block guide-highlight"><span class="guide-label">${escapeHtml(category||'重點')}</span><h3>★ ${escapeHtml(title||'一句話記住')}</h3><p class="guide-body">${escapeHtml(body||STATUS_INCOMPLETE)}</p>${guideImageMarkup(image)}</section>`; return `<section class="guide-block article-block"><div><span class="guide-label">${escapeHtml(category||'骰子教學')}</span><h3>${escapeHtml(title||STATUS_INCOMPLETE)}</h3><p class="guide-body">${escapeHtml(body||STATUS_INCOMPLETE)}</p></div>${guideImageMarkup(image)}</section>`; }
    function renderGuideTable(rows) { const headers=['骰子','武器','防具','項鍊','戒指']; const ordered=rows.map(row=>Object.fromEntries(headers.map(h=>[h,firstValue(row,[h])]))); const highest=Math.max(...ordered.map(row=>Number(row['骰子'])||0)); return `<section class="guide-block"><span class="guide-label">${escapeHtml(firstValue(rows[0],['分類','category'])||'骰子基本性質對照')}</span><h3>${escapeHtml(firstValue(rows[0],['標題','title'])||'骰子基本性質對照')}</h3><div class="guide-table-wrap"><table class="guide-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${ordered.map(row=>`<tr class="${Number(row['骰子'])===highest?'highest':''}">${headers.map(h=>`<td>${escapeHtml(row[h]||STATUS_INCOMPLETE)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`; }

    function renderGuideArticle() { const article=$('guideArticle'); if(!guideRows.length){ article.innerHTML='<div class="guide-error">目前無法取得骰子教學資料，請稍後再試。</div>'; return; } const blocks=[]; const rows=sortGuideRows(guideRows); for(let i=0;i<rows.length;i++){ if(guideType(rows[i])==='表格'||guideType(rows[i])==='table'){ const tableRows=[]; while(i<rows.length&&(guideType(rows[i])==='表格'||guideType(rows[i])==='table')) tableRows.push(rows[i++]); i--; blocks.push(renderGuideTable(tableRows)); } else blocks.push(renderGuideArticleBlock(rows[i])); } article.innerHTML=`<div class="guide-article-head"><div><p class="guide-kicker">DICE GUIDE / BEGINNER</p><h2>骰子</h2><p class="guide-intro">裝備基本性質與骰子使用邏輯</p></div><button class="guide-back" id="backToGuideHome" type="button">← 返回新手教學</button></div><div class="guide-article">${blocks.join('')}</div>`; $('backToGuideHome').addEventListener('click',()=>showGuideHome()); bindGuideImageFallbacks(); }
    async function loadDiceGuide() { try { const response=await fetch(`${CONFIG.guideSheetUrl}&_=${Date.now()}`,{cache:'no-store'}); if(!response.ok)throw new Error(`Dice guide CSV HTTP ${response.status}`); const csv=await response.text(); const rows=parseCsv(csv); const headers=rows.length?Object.keys(rows[0]):[]; const expected=['排序','類型','分類','標題','內文','骰子','武器','防具','項鍊','戒指','圖片網址','是否顯示']; if(!expected.some(header=>headers.includes(header))) console.warn('[Guild Roster] 骰子教學 CSV 欄位異常，目前 Headers:',headers); guideRows=sortGuideRows(rows.filter(row=>isChecked(firstValue(row,['是否顯示','顯示','visible','show'])))); guideLoaded=true; console.log('骰子教學資料:',guideRows); renderGuideArticle(); } catch(error) { console.error('[Guild Roster] 骰子教學讀取失敗：',error); guideLoaded=true; guideRows=[]; renderGuideArticle(); } }
    function runeNumber(row, aliases) { const value=Number(firstValue(row,aliases)); return Number.isFinite(value) ? value : 999999; }

    function runeClassList(rows) { const grouped=new Map(); rows.filter(runeVisible).forEach(row=>{ const name=firstValue(row,['職業','class','job']); if(!name)return; const old=grouped.get(name); const sort=runeSortValue(row); if(!old||sort<old.sort)grouped.set(name,{name,sort}); }); return [...grouped.values()].sort((a,b)=>a.sort-b.sort||a.name.localeCompare(b.name)); }
    const RUNE_PART_TARGETS = { '飾品':3, '防具':5, '武器':2, '徽章':1 };
    function runeGroupRows(rows) { const groups=new Map(); rows.forEach(row=>{ const part=firstValue(row,['裝備部位','部位','part'])||'其他'; if(!groups.has(part))groups.set(part,[]); groups.get(part).push(row); }); return [...groups.entries()].sort((a,b)=>Math.min(...a[1].map(runePriority))-Math.min(...b[1].map(runePriority))||a[0].localeCompare(b[0])); }
    function runePartCounts(rows) { return rows.reduce((counts,row)=>{ const part=firstValue(row,['裝備部位','部位','part'])||'其他'; counts[part]=(counts[part]||0)+1; return counts; },{}); }

    // 目前試算表欄位：公會名稱、 本尊職業、 本尊遊戲ID、 Line名稱、圖片網址、傳說套裝、

    function hasLegendarySet(value) { return value === true || String(value ?? '').trim().toLowerCase() === 'true'; }
    function parseMembers(rows) { return rows.filter(row=>truthy(firstValue(row,['是否顯示','顯示','visible','show']))).map((row,index)=>{ const roles=[]; const guild=firstValue(row,['公會名稱','\u5de5\u6703\u540d\u7a31','guild','guildname']); const mainId=firstValue(row,['本尊遊戲ID','本尊ID','mainid']); const mainClass=firstValue(row,['本尊職業','主職業','mainclass']); const image=firstValue(row,['圖片網址','圖片 URL','圖片URL','角色圖片網址','本尊圖片','角色圖片','圖片','image','avatar']); const legendarySet=hasLegendarySet(firstValue(row,['傳說套裝','legendarySet','legendary'])); if(mainId||mainClass) roles.push(['本尊',mainClass,mainId]); const keys=Object.keys(row); const repeatedClasses=keys.filter(k=>normalizeKey(k).startsWith(normalizeKey('分身職業'))); const repeatedIds=keys.filter(k=>normalizeKey(k).startsWith(normalizeKey('分身ID'))); for(let i=0;i<5;i++){ const id=cleanValue(row[repeatedIds[i]]); const cls=cleanValue(row[repeatedClasses[i]]); if(id||cls) roles.push([`分身 ${i+1}`,cls,id]); } return { guild, lineName:firstValue(row,['LINE名稱','LINE 名稱','Line名稱','line','linename','暱稱']), mainId, mainClass, image, legendarySet, roles, sort:Number(firstValue(row,['排序','sort','order']))||9999, note:firstValue(row,['備註','note']) , index }; }); }
    function getMemberStatus(member) { const hasGameId=Boolean(cleanValue(member.mainId)); const hasGuild=Boolean(cleanValue(member.guild)); const hasMainClass=Boolean(cleanValue(member.mainClass)); const isComplete=hasGameId&&hasGuild&&hasMainClass; let rank=0; if(!isComplete){ if(!hasGameId) rank=1; else if(!hasGuild) rank=2; else rank=3; } return {hasGameId,hasGuild,hasMainClass,isComplete,rank}; }
    function sortMembers(list) { return [...list].sort((a,b)=>{ const statusDiff=getMemberStatus(a).rank-getMemberStatus(b).rank; if(statusDiff)return statusDiff; return (a.sort-b.sort)||(a.index-b.index); }); }

    function render() { const q=$('searchInput').value.trim().toLowerCase(), guild=$('guildFilter').value, cls=$('classFilter').value; const filtered=members.filter(m=>{ const text=[displayGuild(m),m.lineName,displayGameId(m),displayClass(m),...m.roles.flat()].join(' ').toLowerCase(); const guildMatch=guild==='__WAITING_GUILD__'?!getMemberStatus(m).hasGuild:(!guild||m.guild===guild); const classMatch=cls==='__INCOMPLETE__'?!getMemberStatus(m).hasMainClass:(!cls||m.mainClass===cls); return (!q||text.includes(q))&&guildMatch&&classMatch; }); const visible=sortMembers(filtered); $('resultCount').textContent=`顯示 ${visible.length} 位冒險者`; $('memberTotal').textContent=visible.length; $('roleTotal').textContent=visible.reduce((n,m)=>n+m.roles.length,0); $('memberGrid').innerHTML=visible.length?visible.map(m=>{ const status=getMemberStatus(m); return `<button class="member-card${m.legendarySet?' legendary':''}" type="button" data-index="${members.indexOf(m)}"><div class="portrait"><img src="${escapeHtml(avatarUrl(m.image))}" alt="${escapeHtml(displayGameId(m))} 的角色圖片" data-fallback="1"><span class="class-pill">角色展示</span>${m.legendarySet?'<span class="legendary-badge show"><b>✦ 傳說</b><small>LEGENDARY</small></span>':''}</div><div class="card-body"><div class="line-name ${status.hasGuild?'':'pending'}">${escapeHtml(displayGuild(m))}</div><div class="main-id ${status.hasGameId?'':'pending'}">${escapeHtml(displayGameId(m))}</div><div class="card-foot"><span>查看六個角色</span><span>→</span></div></div></button>`; }).join(''):'<div class="empty">找不到符合條件的冒險者<br><small>試試其他關鍵字或清除篩選</small></div>'; $('memberGrid').querySelectorAll('img[data-fallback]').forEach(img=>img.addEventListener('error',()=>{img.src=FALLBACK_IMAGE;img.removeAttribute('data-fallback');},{once:true})); }

    async function loadMembers() { $('guildName').textContent=CONFIG.guildName; try { const response=await fetch(`${CONFIG.sheetUrl}&_=${Date.now()}`,{cache:'no-store'}); if(!response.ok)throw new Error(`Published CSV HTTP ${response.status}`); const csv=await response.text(); if(!csv.includes('公會名稱')&&!csv.includes('\u5de5\u6703\u540d\u7a31')&&!csv.includes('本尊遊戲ID'))throw new Error('公開 CSV 內容不像公會名單，請確認發布的工作表與 GID'); const parsed=parseMembers(parseCsv(csv)); if(!parsed.length)throw new Error('Google Sheet 沒有可用的成員資料'); members=parsed; console.info('[Guild Roster] 已透過發布到網路的 CSV 取得資料。'); fillFilters(); render(); } catch(error) { console.error('[Guild Roster] Google Sheet CSV 讀取失敗：',error); members=[]; $('memberTotal').textContent='—'; $('roleTotal').textContent='—'; $('resultCount').textContent='資料讀取失敗'; $('memberGrid').innerHTML='<div class="error"><strong>目前無法取得 Google Sheet 的公會成員資料。</strong>請確認「發布到網路」連結仍有效，且網址中的 gid=2083968754 指向「公會成員名單」工作表。<br><small>此頁面不會使用虛構會員資料；詳細錯誤已記錄在瀏覽器 Console。</small></div>'; } }

    function customShortEffect(row){ const text=catalogCell(row,'技能效果')||'效果資料整理中'; return text.length>115?`${text.slice(0,115)}…`:text; }
    function customClassOptions(){ return [...RUNE_OFFICIAL_CLASSES]; }
    function customBuildOptions(){ const rows=loadoutByClass(customRuneState.className), builds=loadoutBuildNames(rows); return builds; }
    function customRecommendationRows(){ const rows=loadoutByClass(customRuneState.className); return rows.filter(row=>!customRuneState.build||loadoutCell(row,'流派')===customRuneState.build); }
    function customRecommendedRow(slot){ const rows=customRecommendationRows(); return loadoutDefault(rows,slot.name)||null; }
    function customStatus(slot){ const selected=customSelectedRow(slot), rec=customRecommendedRow(slot); if(!selected)return {label:'尚未選擇',className:'custom-status-custom'}; if(!customSelectionValid(slot,selected))return {label:'⚠ 不適用目前職業／部位',className:'custom-warning'}; const name=catalogCell(selected,'符文名稱'); if(!rec)return {label:'自訂選擇',className:'custom-status-custom'}; if(name===loadoutCell(rec,'符文名稱'))return {label:'✓ 主推薦一致',className:'custom-status-main'}; const alternatives=loadoutSlotCandidates(customRecommendationRows(),slot.name).map(row=>loadoutCell(row,'符文名稱')); if(alternatives.includes(name))return {label:'○ 符合推薦替代',className:'custom-status-alt'}; return {label:'△ 自訂選擇',className:'custom-status-custom'}; }
    function customEffectGroups(){ const groups=[['攻擊力相關',/攻擊力|攻擊強化|傷害增加/,'#d7b56d'],['造成傷害相關',/造成的傷害|傷害量|追加傷害/,'#d98a73'],['暴擊相關',/暴擊/,'#e7a7a1'],['冷卻時間相關',/冷卻|重新使用等待時間/,'#a998dc'],['攻擊速度／施法速度',/攻擊速度|施法速度|蓄力速度/,'#89c5ba'],['防禦／減傷',/防禦|受到傷害減少|護盾/,'#83a9d2'],['治療／支援',/治療|恢復隊友|恢復自身|神聖力/,'#e4d19a'],['持續傷害',/灼傷|冰凍|觸電|中毒|創傷|恐懼|絕望|審判/,'#d88a70'],['破甲／弱化',/護甲破壞|弱化|破碎護甲/,'#c59add']]; const selected=CUSTOM_SLOTS.map(customSelectedRow).filter(Boolean), used=new Set(), result=[]; groups.forEach(([name,re,accent])=>{const matches=selected.filter(row=>re.test(catalogCell(row,'技能效果'))); if(matches.length){matches.forEach(row=>used.add(row));result.push({name,accent,items:matches});}}); const other=selected.filter(row=>!used.has(row)); if(other.length)result.push({name:'其他／特殊觸發',accent:'#a8aab5',items:other}); return result; }
    function customSynergies(){ const selected=CUSTOM_SLOTS.map(customSelectedRow).filter(Boolean), names=selected.map(row=>catalogCell(row,'符文名稱')); return selected.flatMap(row=>{ const text=`${catalogCell(row,'技能效果')} ${catalogCell(row,'備註')}`; return names.filter(other=>other!==catalogCell(row,'符文名稱')&&text.includes(other)).map(other=>[catalogCell(row,'符文名稱'),other]); }).filter((pair,index,all)=>all.findIndex(p=>p.slice().sort().join('|')===pair.slice().sort().join('|'))===index); }
    function customBuilderStorageSave(){ try{localStorage.setItem(CUSTOM_BUILDER_KEY,JSON.stringify(customRuneState));}catch(error){console.warn('[Guild Roster] 自訂配裝儲存失敗：',error);} }
    function customBuilderStorageLoad(){ try{const saved=JSON.parse(localStorage.getItem(CUSTOM_BUILDER_KEY)||'null');if(saved&&typeof saved==='object'){customRuneState={...customRuneState,...saved,slots:{...(saved.slots||{})}};}}catch(error){console.warn('[Guild Roster] 自訂配裝讀取失敗：',error);} }
    function customRenderSummary(){ const groups=customEffectGroups(); const synergies=customSynergies(); return `<div class="custom-summary-list">${groups.map(group=>`<div class="custom-summary-group" style="--summary-accent:${group.accent}"><strong>${group.name}</strong><span>${group.items.map(row=>catalogCell(row,'符文名稱')).join('、')}</span></div>`).join('')||'<p class="custom-note">選擇符文後，這裡會依效果文字分類整理。</p>'}${synergies.length?`<div class="custom-summary-group" style="--summary-accent:#e5c77f"><strong>符文聯動</strong><span>${synergies.map(pair=>`${escapeHtml(pair[0])} ↔ ${escapeHtml(pair[1])}：效果文字明確提到彼此，請查看完整效果確認觸發條件。`).join('<br>')}</span></div>`:''}</div>`; }
    function customRenderCompare(){ const recRows=customRecommendationRows(), rows=CUSTOM_SLOTS.map(slot=>{const selected=customSelectedRow(slot),rec=customRecommendedRow(slot),status=customStatus(slot);return {slot,selected,rec,status};}).filter(item=>item.selected||item.rec); const same=rows.filter(item=>item.selected&&item.rec&&catalogCell(item.selected,'符文名稱')===loadoutCell(item.rec,'符文名稱')).length; return `<div class="custom-compare"><p class="custom-note">目前配裝與「${escapeHtml(customRuneState.className)}・${escapeHtml(customRuneState.build||'通用')}」推薦配置相比：相同 ${same} / ${CUSTOM_SLOTS.length}，其餘依主推薦、替代或自訂狀態顯示。</p>${rows.map(item=>`<div class="custom-compare-row"><b>${item.slot.name}</b><span>你的：${escapeHtml(catalogCell(item.selected,'符文名稱')||'尚未選擇')}<br><em class="${item.status.className}">${item.status.label}</em></span><span>推薦：${escapeHtml(loadoutCell(item.rec,'符文名稱')||'無資料')}</span></div>`).join('')||'<p class="custom-note">尚未取得這個職業的推薦配置。</p>'}</div>`; }
    function customRender(){ const home=$('customRuneBuilder'); if(!runeCatalogLoaded||!loadoutLoaded){home.innerHTML='<div class="guide-error">正在取得符文與職業配裝資料……</div>';return;} if(runeCatalogLoadError||!catalogRuneRows.length){home.innerHTML='<div class="guide-error">目前無法載入符文資料，請稍後再試。<br><button type="button" id="customReloadRunes">重新載入</button></div>'; const retry=$('customReloadRunes'); if(retry)retry.addEventListener('click',async()=>{runeCatalogLoaded=false;runeCatalogLoadError='';runeCatalogRows=[];runeCatalogLoadPromise=null;customRender();await loadRuneCatalog();customRender();}); return;} const classes=customClassOptions(),builds=customBuildOptions(); if(!builds.includes(customRuneState.build))customRuneState.build=builds[0]||''; const slotsHtml=CUSTOM_SLOTS.map(slot=>{const selected=customSelectedRow(slot),status=customStatus(slot);return `<div class="custom-slot ${status.label.includes('不適用')?'invalid':''}"><div class="custom-slot-head"><span>${slot.name}</span><span class="${status.className}">${status.label}</span></div><button class="custom-slot-picker" type="button" data-custom-pick="${slot.name}">${escapeHtml(catalogCell(selected,'符文名稱')||'選擇符文')} <span>⌄</span></button>${selected?`<p class="custom-slot-effect">${escapeHtml(customShortEffect(selected))} <span class="custom-link" data-custom-info="${escapeHtml(catalogCell(selected,'符文名稱'))}">查看完整效果</span></p>`:`<p class="custom-slot-effect">選擇可裝備的${escapeHtml(slot.part)}符文</p>`}</div>`;}).join(''); home.innerHTML=`<section class="custom-builder-head"><div><p class="guide-kicker">CUSTOM RUNE LOADOUT / EFFECT SIMULATOR</p><h2>自訂符文配裝</h2><p>自己搭配 10 個符文槽，整理整套效果與推薦差異。</p><p class="custom-note">本工具只整理符文效果，不等同實際戰鬥 DPS 計算。</p></div><div class="custom-builder-actions"><button type="button" id="customBackGuide">← 返回新手教學</button><button type="button" id="customApplyRecommended">套用推薦配裝</button><button type="button" id="customClear">清除全部</button><button type="button" id="customCopy">複製配裝</button></div></section><section class="custom-builder-panel"><div class="custom-builder-controls"><label class="field"><span>選擇職業</span><select class="custom-builder-select" id="customClassSelect">${classes.map(name=>`<option value="${escapeHtml(name)}" ${customRuneState.className===name?'selected':''}>${escapeHtml(name)}</option>`).join('')}</select></label><label class="field"><span>比較推薦流派</span><select class="custom-builder-select" id="customBuildSelect">${builds.map(build=>`<option value="${escapeHtml(build)}" ${customRuneState.build===build?'selected':''}>${escapeHtml(build)}</option>`).join('')}</select></label></div></section><div class="custom-builder-layout"><section class="custom-builder-panel"><h3>自訂 10 個符文槽</h3><div class="custom-slot-grid">${slotsHtml}</div></section><aside class="custom-builder-panel"><h3>整套效果摘要</h3>${customRenderSummary()}<p class="custom-note">效果分類依技能效果文字整理，不會無條件相加百分比；若看到滿層數值，仍須以遊戲觸發條件為準。</p></aside></div><section class="custom-builder-panel"><h3>與推薦配裝比較</h3>${customRenderCompare()}</section>`; $('customBackGuide').addEventListener('click',showGuideHome); $('customClassSelect').addEventListener('change',e=>{customRuneState.className=e.target.value;customRuneState.slots={};customRuneState.build='';customBuilderStorageSave();customRender();}); $('customBuildSelect').addEventListener('change',e=>{customRuneState.build=e.target.value;customBuilderStorageSave();customRender();}); home.querySelectorAll('[data-custom-pick]').forEach(button=>button.addEventListener('click',()=>customOpenChooser(button.dataset.customPick))); home.querySelectorAll('[data-custom-info]').forEach(link=>link.addEventListener('click',()=>showRuneCatalogInfo(link.dataset.customInfo))); $('customApplyRecommended').addEventListener('click',()=>{customRuneState.slots={};CUSTOM_SLOTS.forEach(slot=>{const row=customRecommendedRow(slot);if(row)customRuneState.slots[slot.name]=loadoutCell(row,'符文名稱');});customBuilderStorageSave();customRender();}); $('customClear').addEventListener('click',()=>{customRuneState.slots={};customBuilderStorageSave();customRender();}); $('customCopy').addEventListener('click',async()=>{const text=`${customRuneState.className} 自訂配裝\n${CUSTOM_SLOTS.map(slot=>`${slot.name}：${customRuneState.slots[slot.name]||'尚未選擇'}`).join('\n')}`;try{await navigator.clipboard.writeText(text);$('customCopy').textContent='已複製！';setTimeout(()=>{if($('customCopy'))$('customCopy').textContent='複製配裝';},1200);}catch(error){console.warn('[Guild Roster] 複製配裝失敗：',error);}}); }
    async function showCustomRuneBuilder(){ $('guideHome').hidden=true; $('guideArticle').hidden=true; $('spiritTraceHome').hidden=true; $('runeHome').hidden=true; $('runeDetail').hidden=true; $('loadoutHome').hidden=true; $('loadoutDetail').hidden=true; $('customRuneBuilder').hidden=false; customBuilderStorageLoad(); if(!runeCatalogLoaded)await loadRuneCatalog(); if(!loadoutLoaded)await loadLoadout(); customRender(); }
    function customOpenChooser(slotName){ const slot=CUSTOM_SLOTS.find(item=>item.name===slotName); if(!slot)return; const dialog=$('customRuneChooserDialog'),search=$('customRuneChooserSearch'),body=$('customRuneChooserBody'); $('customRuneChooserTitle').textContent=`${slot.name} · 選擇${slot.part}符文`; const render=()=>{const query=search.value.trim().toLowerCase(),rows=customCandidates(slot).filter(row=>!query||[catalogCell(row,'符文名稱'),catalogCell(row,'技能效果'),catalogCell(row,'職業限制')].join(' ').toLowerCase().includes(query)); if(!rows.length){console.warn('[Guild Roster] 自訂配裝候選為 0：',{className:customRuneState.className,slot:slot.name,part:slot.part,totalRunes:catalogRuneRows.length,partMatches:catalogRuneRows.filter(row=>catalogCell(row,'裝備部位')===slot.part).length});} body.innerHTML=rows.length?rows.map(row=>`<button class="loadout-candidate" type="button" data-custom-choice="${escapeHtml(catalogCell(row,'符文名稱'))}"><span class="loadout-candidate-top"><span class="loadout-candidate-name">${escapeHtml(catalogCell(row,'符文名稱'))}</span><span class="loadout-tag">${escapeHtml(catalogCell(row,'職業限制')||'全職業')}</span></span><p>${escapeHtml(customShortEffect(row))}</p></button>`).join(''):'<div class="guide-error">找不到符合目前裝備部位的符文。</div>';}; search.value='';search.oninput=render;body.onclick=e=>{const button=e.target.closest('[data-custom-choice]');if(!button)return;customRuneState.slots[slot.name]=button.dataset.customChoice;customBuilderStorageSave();dialog.close();customRender();};render();dialog.showModal(); }
    // 所有教學工具共用資料，但畫面必須彼此隔離；切換任何其他工具時隱藏自訂配裝專屬容器。
    function hideCustomRuneBuilderView(){ const view=$('customRuneBuilder'); if(view)view.hidden=true; }
    const originalShowGuideHome=showGuideHome; showGuideHome=function(){originalShowGuideHome();hideCustomRuneBuilderView();};
    const originalShowGuideArticle=showGuideArticle; showGuideArticle=function(){hideCustomRuneBuilderView();originalShowGuideArticle();};
    const originalShowSpiritTraceTool=showSpiritTraceTool; showSpiritTraceTool=function(){hideCustomRuneBuilderView();originalShowSpiritTraceTool();};
    const originalShowRuneHome=showRuneHome; showRuneHome=function(){hideCustomRuneBuilderView();originalShowRuneHome();};
    const originalShowRuneDetail=showRuneDetail; showRuneDetail=function(){hideCustomRuneBuilderView();originalShowRuneDetail.apply(this,arguments);};
    const originalShowLoadoutHome=showLoadoutHome; showLoadoutHome=function(){hideCustomRuneBuilderView();originalShowLoadoutHome.apply(this,arguments);};
    const originalShowLoadoutDetail=showLoadoutDetail; showLoadoutDetail=function(){hideCustomRuneBuilderView();originalShowLoadoutDetail.apply(this,arguments);};
    const originalLoadRuneCatalog=loadRuneCatalog;
    loadRuneCatalog=function(){
      if(runeCatalogLoaded)return Promise.resolve(runeCatalogRows);
      if(runeCatalogLoadPromise)return runeCatalogLoadPromise;
      runeCatalogLoadPromise=originalLoadRuneCatalog().then(()=>runeCatalogRows).catch(error=>{console.error('[Guild Roster] 傳說符文共用載入器失敗：',error);return runeCatalogRows;});
      return runeCatalogLoadPromise;
    };
    $('runeGuideEntry').querySelector('h3').textContent='傳說符文圖鑑'; $('runeGuideEntry').querySelector('p').textContent='查看武器、防具、飾品與徽章完整效果'; $('loadoutEntry').querySelector('p').textContent='18職完整推薦、流派與替代符文'; $('searchInput').addEventListener('input',render); $('guildFilter').addEventListener('change',render); $('classFilter').addEventListener('change',render); $('memberGrid').addEventListener('click',e=>{const card=e.target.closest('.member-card');if(card)openMember(members[Number(card.dataset.index)]);}); $('closeModal').addEventListener('click',()=>$('memberDialog').close()); $('memberDialog').addEventListener('click',e=>{if(e.target===$('memberDialog'))$('memberDialog').close();}); $('closeLoadoutChoice').addEventListener('click',()=>$('loadoutChoiceDialog').close()); $('closeRuneInfo').addEventListener('click',()=>$('runeInfoDialog').close()); $('loadoutChoiceDialog').addEventListener('click',e=>{if(e.target===$('loadoutChoiceDialog'))$('loadoutChoiceDialog').close();}); $('runeInfoDialog').addEventListener('click',e=>{if(e.target===$('runeInfoDialog'))$('runeInfoDialog').close();}); $('membersTab').addEventListener('click',()=>switchView('members')); $('guidesTab').addEventListener('click',()=>switchView('guides')); $('diceGuideEntry').addEventListener('click',()=>showGuideArticle()); $('spiritTraceEntry').addEventListener('click',()=>showSpiritTraceTool()); $('runeGuideEntry').addEventListener('click',()=>showRuneHome()); $('loadoutEntry').addEventListener('click',()=>showLoadoutHome()); $('customRuneBuilderEntry').addEventListener('click',()=>showCustomRuneBuilder()); document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('memberDialog').open)$('memberDialog').close();}); loadMembers();
    $('closeCustomRuneChooser').addEventListener('click',()=>$('customRuneChooserDialog').close()); $('customRuneChooserDialog').addEventListener('click',e=>{if(e.target===$('customRuneChooserDialog'))$('customRuneChooserDialog').close();});
  </script>
