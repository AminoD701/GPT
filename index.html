<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>瑪奇Mobile│迪恩│公會成員名單</title>
</head>
<body>
  <noscript>此網站需要啟用 JavaScript。</noscript>
  <script>
    (async () => {
      try {
        const response = await fetch('./site.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`site.html HTTP ${response.status}`);
        let html = await response.text();
        html = html.replace('</head>', '<link rel="stylesheet" href="./task-progress-v2.css?v=4"><link rel="stylesheet" href="./pet-guide-v4.css?v=1"></head>');
        html = html.replace('</body>', '<script src="./task-progress-v3.js?v=2"><\/script><script src="./member-bottom-space.js?v=1"><\/script><script src="./pet-guide-v4.js?v=1"><\/script><script src="./pet-guide-v5.js?v=1"><\/script><script src="./pet-special-tags.js?v=2"><\/script><script src="./pet-skill-dedupe.js?v=1"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('[Site Loader] 載入主網站失敗：', error);
        document.body.innerHTML = '<main style="font-family:system-ui,sans-serif;padding:32px;color:#eee;background:#111;min-height:100vh"><h1>網站載入失敗</h1><p>請重新整理頁面；若問題持續發生，請檢查 site.html 是否存在。</p></main>';
      }
    })();
  </script>
</body>
</html>
