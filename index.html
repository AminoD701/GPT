<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="おやす米攻略">
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="icon" href="./icon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" sizes="180x180">
  <title>【おやす米 - 瑪奇Mobile攻略網】｜迪恩｜</title>
</head>
<body>
  <noscript>此網站需要啟用 JavaScript。</noscript>
  <script>
    (async () => {
      try {
        const response = await fetch('./site.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`site.html HTTP ${response.status}`);
        let html = await response.text();
        const pwaHead = '<meta name="theme-color" content="#0b0e14"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="おやす米攻略"><link rel="manifest" href="./manifest.webmanifest?v=2"><link rel="icon" href="./icon-192.png?v=2" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" sizes="180x180">';
        html = html.replace('</head>', pwaHead + '<link rel="stylesheet" href="./task-progress-v2.css?v=5"><link rel="stylesheet" href="./task-journal-v4.css?v=2"><link rel="stylesheet" href="./member-polish.css?v=1"><link rel="stylesheet" href="./pet-guide-v4.css?v=1"><link rel="stylesheet" href="./professional-theme.css?v=1"><link rel="stylesheet" href="./editorial-polish.css?v=1"><link rel="stylesheet" href="./header-title-fix.css?v=2"><link rel="stylesheet" href="./member-profile-layout.css?v=1"><link rel="stylesheet" href="./top-nav-polish.css?v=1"><link rel="stylesheet" href="./home-hub.css?v=1"><link rel="stylesheet" href="./guide-categories.css?v=1"><link rel="stylesheet" href="./site-search.css?v=1"><link rel="stylesheet" href="./mobile-app-nav.css?v=1"><link rel="stylesheet" href="./mobile-app-pages.css?v=1"></head>');
        html = html.replace('</body>', '<script src="./task-progress-v5.js?v=2"><\/script><script src="./task-shared-reconcile.js?v=1"><\/script><script src="./task-live-sync.js?v=1"><\/script><script src="./task-dialog-lock.js?v=1"><\/script><script src="./member-bottom-space.js?v=2"><\/script><script src="./member-card-cleanup.js?v=1"><\/script><script src="./pet-guide-v4.js?v=1"><\/script><script src="./pet-guide-v5.js?v=1"><\/script><script src="./pet-special-tags.js?v=2"><\/script><script src="./pet-skill-dedupe.js?v=1"><\/script><script src="./home-hub.js?v=1"><\/script><script src="./guide-categories.js?v=1"><\/script><script src="./site-search.js?v=1"><\/script><script src="./view-state.js?v=3"><\/script><script src="./header-title-fix.js?v=3"><\/script><script src="./tab-title-fix.js?v=1"><\/script><script src="./pwa-init.js?v=2"><\/script><script src="./mobile-app-nav.js?v=1"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('[Site Loader] 載入主網站失敗：', error);
        document.body.innerHTML = '<main style="font-family:system-ui,sans-serif;padding:32px;color:#eee;background:#111;min-height:100vh"><h1>網站載入失敗</h1><p>請重新整理頁面；若問題持續發生，請檢查 site.html 是否存在。</p></main>';
      }
    })();
  </script>
</body>
</html>
